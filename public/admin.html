<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Certif Clock - admin</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <h1>Certif Clock admin</h1>
      <div>
        <span id="who" class="muted"></span>
        <button id="logout" class="secondary hidden">Afmelden</button>
        <a href="/">Borden</a>
      </div>
    </header>

    <main>
      <section id="login-section" class="card">
        <h2>Aanmelden</h2>
        <form id="login-form">
          <label>Gebruikersnaam <input name="username" autocomplete="username" required /></label>
          <label>Wachtwoord
            <input name="password" type="password" autocomplete="current-password" required />
          </label>
          <button type="submit">Aanmelden</button>
          <p id="login-message" class="message"></p>
        </form>
      </section>

      <section id="app-section" class="hidden">
        <article class="card">
          <h2>Certificatie starten</h2>
          <form id="start-form">
            <label>PERID kandidaat
              <input name="perid" inputmode="numeric" pattern="[0-9]{4,10}" placeholder="096069" required />
            </label>
            <label>Bord
              <select name="board">
                <option value="1">Bord 1</option>
                <option value="2">Bord 2</option>
                <option value="3">Bord 3</option>
              </select>
            </label>
            <label>Locatie <input name="location" placeholder="Brussel - lokaal 2.14" required /></label>
            <label>Duur (minuten) <input name="durationMinutes" type="number" min="1" max="1440" value="120" /></label>
            <button type="submit">Start klok</button>
            <p id="start-message" class="message"></p>
          </form>
        </article>

        <article class="card" style="margin-top: 1.25rem">
          <h2>Borden</h2>
          <div id="board-list" class="boards"></div>
        </article>

        <article class="card" style="margin-top: 1.25rem">
          <h2>Historiek</h2>
          <table>
            <thead>
              <tr>
                <th>PERID</th>
                <th>Bord</th>
                <th>Locatie</th>
                <th>Gestart</th>
                <th>Einde</th>
                <th>Door</th>
              </tr>
            </thead>
            <tbody id="history"></tbody>
          </table>
        </article>

        <article id="owner-section" class="card hidden" style="margin-top: 1.25rem">
          <h2>Gebruikers (owner)</h2>
          <form id="user-form">
            <label>Gebruikersnaam <input name="username" required /></label>
            <label>Wachtwoord <input name="password" type="password" minlength="8" required /></label>
            <label>Rol
              <select name="role">
                <option value="expert">Expert</option>
                <option value="owner">Owner</option>
              </select>
            </label>
            <button type="submit">Gebruiker aanmaken</button>
            <p id="user-message" class="message"></p>
          </form>
          <table>
            <thead>
              <tr><th>Gebruiker</th><th>Rol</th><th></th></tr>
            </thead>
            <tbody id="users"></tbody>
          </table>
        </article>
      </section>
    </main>

    <script src="/clock.js"></script>
    <script>
      let currentUser = null;

      const loginSection = document.getElementById('login-section');
      const appSection = document.getElementById('app-section');
      const ownerSection = document.getElementById('owner-section');
      const logoutButton = document.getElementById('logout');
      const whoEl = document.getElementById('who');

      function setMessage(id, text, ok) {
        const el = document.getElementById(id);
        el.textContent = text;
        el.className = `message ${text ? (ok ? 'ok' : 'error') : ''}`;
      }

      function cell(row, text) {
        const td = document.createElement('td');
        td.textContent = text;
        row.appendChild(td);
        return td;
      }

      async function renderBoards() {
        const { boards } = await api('/api/boards');
        const list = document.getElementById('board-list');
        list.innerHTML = '';
        boards.forEach((board) => {
          const cert = board.certification;
          const card = document.createElement('div');
          card.className = 'card';
          const title = document.createElement('h3');
          title.textContent = `Bord ${board.board}`;
          const clock = document.createElement('div');
          clock.className = 'clock';
          clock.dataset.ends = cert ? cert.endsAt : '';
          clock.textContent = cert ? formatDuration(remainingSeconds(cert.endsAt)) : '--:--:--';
          const info = document.createElement('p');
          info.className = 'muted';
          info.textContent = cert ? `PERID ${cert.perid} · ${cert.location}` : 'Vrij';
          const link = document.createElement('a');
          link.href = `/board/${board.board}`;
          link.textContent = `Directe link naar bord ${board.board}`;
          const qr = document.createElement('img');
          qr.className = 'qr';
          qr.alt = `QR-code bord ${board.board}`;
          qr.src = `/api/boards/${board.board}/qr.png`;
          card.append(title, clock, info, link, document.createElement('br'), qr);
          if (cert) {
            const stop = document.createElement('button');
            stop.className = 'secondary';
            stop.textContent = 'Stop';
            stop.addEventListener('click', async () => {
              await api(`/api/certifications/${cert.id}/stop`, { method: 'POST' });
              await refreshAll();
            });
            card.appendChild(stop);
          }
          list.appendChild(card);
        });
      }

      async function renderHistory() {
        const { certifications } = await api('/api/certifications');
        const tbody = document.getElementById('history');
        tbody.innerHTML = '';
        certifications.forEach((item) => {
          const row = document.createElement('tr');
          cell(row, item.perid);
          cell(row, item.board);
          cell(row, item.location);
          cell(row, new Date(item.startedAt).toLocaleString('nl-BE'));
          cell(row, new Date(item.endsAt).toLocaleString('nl-BE'));
          cell(row, item.startedBy);
          tbody.appendChild(row);
        });
      }

      async function renderUsers() {
        if (!currentUser || currentUser.role !== 'owner') return;
        const { users } = await api('/api/users');
        const tbody = document.getElementById('users');
        tbody.innerHTML = '';
        users.forEach((user) => {
          const row = document.createElement('tr');
          cell(row, user.username);
          cell(row, user.role);
          const actions = cell(row, '');
          if (user.id !== currentUser.id) {
            const remove = document.createElement('button');
            remove.className = 'secondary';
            remove.textContent = 'Verwijder';
            remove.addEventListener('click', async () => {
              await api(`/api/users/${user.id}`, { method: 'DELETE' });
              await renderUsers();
            });
            actions.appendChild(remove);
          }
          tbody.appendChild(row);
        });
      }

      async function refreshAll() {
        await renderBoards();
        await renderHistory();
        await renderUsers();
      }

      function applyUser(user) {
        currentUser = user;
        loginSection.classList.toggle('hidden', Boolean(user));
        appSection.classList.toggle('hidden', !user);
        logoutButton.classList.toggle('hidden', !user);
        ownerSection.classList.toggle('hidden', !user || user.role !== 'owner');
        whoEl.textContent = user ? `${user.username} (${user.role})` : '';
        if (user) refreshAll();
      }

      document.getElementById('login-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const form = new FormData(event.target);
        try {
          const data = await api('/api/login', {
            method: 'POST',
            body: JSON.stringify({
              username: form.get('username'),
              password: form.get('password'),
            }),
          });
          setMessage('login-message', '');
          applyUser(data.user);
        } catch (err) {
          setMessage('login-message', err.message);
        }
      });

      document.getElementById('start-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const form = new FormData(event.target);
        try {
          const state = await api('/api/certifications', {
            method: 'POST',
            body: JSON.stringify({
              perid: form.get('perid'),
              board: form.get('board'),
              location: form.get('location'),
              durationMinutes: form.get('durationMinutes'),
            }),
          });
          setMessage(
            'start-message',
            `Klok gestart. Link voor de kandidaat: ${window.location.origin}${state.url}`,
            true
          );
          await refreshAll();
        } catch (err) {
          setMessage('start-message', err.message);
        }
      });

      document.getElementById('user-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const form = new FormData(event.target);
        try {
          await api('/api/users', {
            method: 'POST',
            body: JSON.stringify({
              username: form.get('username'),
              password: form.get('password'),
              role: form.get('role'),
            }),
          });
          event.target.reset();
          setMessage('user-message', 'Gebruiker aangemaakt', true);
          await renderUsers();
        } catch (err) {
          setMessage('user-message', err.message);
        }
      });

      logoutButton.addEventListener('click', async () => {
        await api('/api/logout', { method: 'POST' });
        await refreshCsrfToken();
        applyUser(null);
      });

      setInterval(() => {
        document.querySelectorAll('#board-list .clock').forEach((el) => {
          if (!el.dataset.ends) return;
          const seconds = remainingSeconds(el.dataset.ends);
          el.textContent = formatDuration(seconds);
          el.classList.toggle('finished', seconds <= 0);
        });
      }, 1000);

      api('/api/me').then((data) => applyUser(data.user));
    </script>
  </body>
</html>
