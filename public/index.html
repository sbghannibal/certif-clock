<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Certif Clock - borden</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <h1>Certif Clock</h1>
      <a href="/admin.html">Admin</a>
    </header>
    <main>
      <p class="muted">
        Maximaal 3 borden. Scan de QR-code of gebruik de directe link om enkel jouw klok te bekijken.
      </p>
      <section id="boards" class="boards"></section>
    </main>

    <script src="/clock.js"></script>
    <script>
      const container = document.getElementById('boards');

      function render(boards) {
        container.innerHTML = '';
        boards.forEach((board) => {
          const card = document.createElement('article');
          card.className = 'card';
          const cert = board.certification;
          card.innerHTML = `
            <h2>Bord ${board.board}</h2>
            <div class="clock">--:--:--</div>
            <p class="muted"></p>
            <p><a href="/board/${board.board}">Directe link naar bord ${board.board}</a></p>
            <img class="qr" alt="QR-code bord ${board.board}" src="/api/boards/${board.board}/qr.png" />
          `;
          card.querySelector('.clock').dataset.ends = cert ? cert.endsAt : '';
          card.querySelector('.muted').textContent = cert
            ? `PERID ${cert.perid} · ${cert.location}`
            : 'Vrij';
          container.appendChild(card);
        });
        tick();
      }

      function tick() {
        container.querySelectorAll('.clock').forEach((el) => {
          const endsAt = el.dataset.ends;
          if (!endsAt) {
            el.textContent = '--:--:--';
            return;
          }
          const seconds = remainingSeconds(endsAt);
          el.textContent = formatDuration(seconds);
          el.classList.toggle('finished', seconds <= 0);
          el.classList.toggle('warning', seconds > 0 && seconds <= 300);
        });
      }

      async function refresh() {
        try {
          const data = await api('/api/boards');
          render(data.boards);
        } catch (err) {
          container.textContent = err.message;
        }
      }

      refresh();
      setInterval(refresh, 15000);
      setInterval(tick, 1000);
    </script>
  </body>
</html>
